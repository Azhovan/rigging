# Example configuration file for the conf library demo
# This file demonstrates YAML-based configuration

environment: staging

database:
  host: db.staging.example.com
  port: 5432
  name: myapp_staging
  user: app_user
  password: staging_password_123
  max_connections: 25
  ssl_mode: require
  connect_timeout: 10s

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s

logging:
  level: info
  format: json
  output: stdout

features:
  enable_metrics: true
  enable_tracing: false
  rate_limit: 1000
